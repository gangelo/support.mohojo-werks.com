name: Accumoo Issue
description: Report an issue or request support for Accumoo
title: "[Accumoo] "
labels: ["accumoo"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue with Accumoo!
        
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What type of issue are you reporting?
      options:
        - Bug Report
        - Feature Request
        - Support Question
        - Other
    validations:
      required: true
      
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please provide a detailed description of your issue
      placeholder: Describe your issue here...
    validations:
      required: true
      
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce (if applicable)
      description: If this is a bug, please provide steps to reproduce it
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false
      
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false
      
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: false
      
  - type: input
    id: version
    attributes:
      label: App Version
      description: Which version of Accumoo are you using?
      placeholder: e.g., 1.0.0
    validations:
      required: false
      
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you using?
      options:
        - iOS
        - Android
        - Both
    validations:
      required: false
      
  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Any other information that might be helpful
    validations:
      required: false
